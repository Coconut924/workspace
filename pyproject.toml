[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iterm-workspace"
version = "0.3.0"
description = "Declarative native iTerm2 workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "iterm2>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "PyInstaller==6.22.0"]

[project.scripts]
workspace = "workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
